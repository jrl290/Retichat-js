<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retichat Debug Harness</title>
<style>
  html,body{margin:0;background:#0F0F1A;color:#c8d0e0;font:12px/1.5 ui-monospace,Menlo,monospace}
  #app{display:none}
  #hdr{padding:8px 12px;background:#161626;border-bottom:1px solid #262640;position:sticky;top:0}
  #hdr b{color:#7fd1ff}
  #hdr .k{color:#8890a8;margin-left:10px}
  #log{padding:8px 12px;white-space:pre-wrap;word-break:break-all}
  .rx{color:#7fe08a}.tx{color:#ffd479}.err{color:#ff6b6b}.ev{color:#8890a8}
</style>
<!-- Identical import map to index.html: the harness runs the REAL stack. -->
<script type="importmap">
{
  "imports": {
    "crypto": "./lib/shims/crypto.js",
    "buffer": "https://esm.sh/buffer@6.0.3",
    "@noble/curves/": "https://esm.sh/@noble/curves@1.6.0/",
    "@noble/hashes/": "https://esm.sh/@noble/hashes@1.7.1/",
    "msgpackr": "https://esm.sh/msgpackr@1.11.2",
    "aes-js": "https://esm.sh/aes-js@3.1.2",
    "net": "./lib/shims/net.js",
    "ws": "./lib/shims/ws.js"
  }
}
</script>
<script>
/* ---------------------------------------------------------------------------
 * Pre-boot seeding. This CLASSIC script runs before the app.js module, so the
 * storage app.js reads on startup is already populated. That lets a headless
 * driver pin a deterministic identity and exchange URL via the query string
 * and skip the onboarding view entirely.
 *
 * Query parameters:
 *   ?identity=<128 hex>  pin the device identity private key
 *   ?distro=<128 hex>    pin the distro identity private key
 *   ?exchange=<url>      PostInterface exchange URL
 *   ?rfed=<hex>          RFed node identity hash
 *   ?name=<string>       display name
 *   ?iface=<string>      PostInterface name registered on the PHP node
 *   ?reset=1             clear all retichat_* keys before seeding
 * ------------------------------------------------------------------------- */
(function () {
  var P = new URLSearchParams(location.search);
  var PFX = "retichat_";
  function put(k, v) { localStorage.setItem(PFX + k, JSON.stringify(v)); }

  if (P.get("reset") === "1") {
    Object.keys(localStorage)
      .filter(function (k) { return k.indexOf(PFX) === 0; })
      .forEach(function (k) { localStorage.removeItem(k); });
  }

  var hex128 = /^[0-9a-f]{128}$/i;
  var ident = P.get("identity");
  if (ident && hex128.test(ident)) put("identity_private_key", ident.toLowerCase());

  var distro = P.get("distro");
  // DistroManager stores raw hex under an already-prefixed key, not JSON.
  if (distro && hex128.test(distro)) localStorage.setItem("retichat_distro_identity", distro.toLowerCase());

  var exchange = P.get("exchange");
  if (exchange) put("exchangeUrl", exchange);

  var rfed = P.get("rfed");
  if (rfed) put("rfedNodeHash", rfed.toLowerCase());

  var name = P.get("name");
  if (name) put("displayName", name);

  var iface = P.get("iface");
  if (iface) put("interfaceName", iface);

  // Surface uncaught failures to the driver rather than only the console.
  window.__bootErrors = [];
  window.addEventListener("error", function (e) { window.__bootErrors.push(String(e.message)); });
  window.addEventListener("unhandledrejection", function (e) {
    window.__bootErrors.push(String((e.reason && e.reason.message) || e.reason));
  });
})();
</script>
</head>
<body>
<div id="hdr">
  <b>Retichat Debug Harness</b>
  <span class="k">id</span> <span id="h-id">…</span>
  <span class="k">lxmf</span> <span id="h-lxmf">…</span>
  <span class="k">status</span> <span id="h-status">…</span>
  <span class="k">distro</span> <span id="h-distro">–</span>
</div>
<div id="log">booting…</div>

<!-- The real application. Its UI renders into #app, which stays hidden. -->
<div id="app"></div>
<script type="module" src="app.js"></script>

<script type="module">
/* ---------------------------------------------------------------------------
 * window.Debug — thin alias over the harness surface that app.js exposes on
 * window.RetichatTest. No protocol logic lives here: every operation runs the
 * same code path the shipped client uses, so a green harness run means the
 * client itself works.
 * ------------------------------------------------------------------------- */
const logEl = document.getElementById("log");
const lines = [];
function write(cls, text) {
  lines.push(`<span class="${cls}">${new Date().toISOString().slice(11, 23)} ${text}</span>`);
  if (lines.length > 400) lines.shift();
  logEl.innerHTML = lines.join("\n");
}

// app.js is a classic (non-exporting) module; wait for it to publish its API.
async function whenAppReady() {
  for (let i = 0; i < 600; i++) {
    if (window.RetichatTest && window.Harness) return window.RetichatTest;
    await new Promise(r => setTimeout(r, 50));
  }
  throw new Error("app.js did not expose RetichatTest within 30s");
}

const T = await whenAppReady();
window.Debug = T;

// Mirror harness events into the on-screen log. Assertions must read
// Debug.inbox / Debug.events, never this DOM.
let seenEvents = 0;
setInterval(() => {
  const ev = T.events;
  for (; seenEvents < ev.length; seenEvents++) {
    const e = ev[seenEvents];
    const cls = e.kind === "rx" ? "rx" : e.kind === "error" ? "err" : "ev";
    write(cls, `${e.kind} ${JSON.stringify(e.detail)}`);
  }
  const id = T.identity();
  document.getElementById("h-id").textContent = (id.identityHash || "…").slice(0, 12);
  document.getElementById("h-lxmf").textContent = (id.lxmfDest || "…").slice(0, 12);
  document.getElementById("h-status").textContent = id.status || "…";
  const d = T.distro();
  document.getElementById("h-distro").textContent = d.has ? d.lxmfDeliveryHash.slice(0, 12) : "–";
}, 250);

T.ready.then(() => write("ev", "READY"));
write("ev", "harness attached — use window.Debug (Debug.help())");
</script>
</body>
</html>
